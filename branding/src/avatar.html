<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
/* ?v=dark|blue|plain  ?n=size. Telegram crops avatars to a circle, so the mark sits well inside it */
:root{--w:640px;--h:640px}
.stage{display:grid;place-items:center;--cell:40px}
.dark .stage{background:radial-gradient(55% 55% at 50% 42%,rgb(47 168 255 / .30),transparent 70%),radial-gradient(100% 100% at 50% 0%,#0d1622,var(--ink))}
.blue .stage{background:radial-gradient(90% 90% at 30% 15%,#5cc0ff,#1a8cf0 45%,#0057a8)}
.blue .grid{background-image:linear-gradient(rgb(255 255 255 / .07) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .07) 1px,transparent 1px)}
.plain .stage{background:transparent} .plain .grid{display:none} .plain body,.plain{background:transparent}
.m{width:50%;height:50%;margin-top:4%;filter:drop-shadow(0 18px 40px rgb(0 0 0 / .45))}
.blue .m{filter:drop-shadow(0 18px 36px rgb(0 40 90 / .45))}
.plain .m{width:94%;height:94%;margin:0;filter:none}
</style></head>
<body><div class="stage"><div class="grid" style="mask-image:radial-gradient(50% 50% at 50% 50%,#000 20%,transparent 75%)"></div><div class="m" data-mark></div></div>
<script>const q=new URLSearchParams(location.search),v=q.get('v')||'dark',n=q.get('n')||640;
document.documentElement.className=v;
document.documentElement.style.setProperty('--w',n+'px');document.documentElement.style.setProperty('--h',n+'px');</script>
<script src="mark.js"></script>
<script>
// the blue variant draws a white gem so it doesn't vanish into the background
if(v==='blue'){document.querySelector('[data-mark]').innerHTML=MARK('b').replace(/url\(#bf\)/,'#fff').replace(/stroke="#fff"/g,'stroke="#1a8cf0"').replace('stroke-opacity=".38"','stroke-opacity=".5"');}
</script></body></html>
